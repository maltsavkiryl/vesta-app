name: CI

# Enforces the same gates as `pnpm check` (compile + test + depcruise + doctor)
# on every PR into main and on direct pushes to main. Split into discrete steps
# so the GitHub UI shows exactly which gate failed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile · Lint · Test · Deps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Expo Router's typed-routes file (.expo/types/router.d.ts) is gitignored
      # and only generated by `expo start`, not `expo export`. On a fresh CI
      # checkout it is absent, so `tsc` runs with the loose (string) Href type:
      # everything else is checked strictly, only route-literal hrefs are not.
      # This avoids false positives from stale types; the dev server enforces
      # route-literal correctness locally.
      - name: Typecheck
        run: pnpm compile

      - name: Lint
        run: pnpm lint:check

      - name: Test
        run: pnpm test --runInBand

      - name: Dependency boundaries
        run: pnpm depcruise:check

      # expo-doctor flags toolchain/version drift. Informational only — it can
      # fail on transient registry/version-suggestion noise unrelated to the PR.
      - name: Expo Doctor
        run: pnpm doctor
        continue-on-error: true
